name: Weekly update

# Every Monday at 14:00 UTC (6am PST). Fetching every Ashby, Greenhouse and Lever board takes
# about an hour or two, so fresh jobs are up by 9am PST.
# You can also run it any time from the Actions tab: "Weekly update" -> "Run workflow".
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write    # save the updated company list back to the repo
  pages: write       # publish the site
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find companies new to Ashby, Greenhouse and Lever
        # A problem here shouldn't stop the weekly jobs refresh.
        continue-on-error: true
        run: python3 -u scraper/update_companies.py

      - name: Fetch every company's jobs
        run: python3 -u scraper/ingest.py --db jobs.db --no-descriptions --workers 10

      - name: Build the site's data
        # Stops here (and keeps last week's site) if the refresh looks broken.
        run: python3 -u scraper/build_data.py --db jobs.db --out site/data

      - name: Save the updated company list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A scraper
          if git diff --cached --quiet; then
            echo "Company list unchanged."
          else
            git commit -m "Weekly company list update"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish the site
        id: deploy
        uses: actions/deploy-pages@v4
