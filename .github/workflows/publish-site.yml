name: Publish site changes

# When files in site/ change, publish them straight away, reusing this week's job data
# from the live site, so design tweaks don't need the full weekly data pull.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Reuse this week's job data from the live site
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          curl -fsSL --retry 3 "$base/meta.json" -o site/data/meta.json
          python3 - "$base" <<'PY'
          import json, subprocess, sys
          base = sys.argv[1]
          meta = json.load(open("site/data/meta.json"))
          files = [f["file"] for f in meta.get("files", [])] or ["jobs.json"]
          total = 0
          for name in files:
              subprocess.run(["curl", "-fsSL", "--retry", "3", f"{base}/{name}", "-o", f"site/data/{name}"], check=True)
              total += len(json.load(open(f"site/data/{name}"))["jobs"])
          assert total > 1000, total
          print(f"{total} jobs reused from {len(files)} file(s)")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish the site
        id: deploy
        uses: actions/deploy-pages@v4
