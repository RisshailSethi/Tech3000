name: Rebuild company list

# Builds the company lists (companies.tsv for Ashby, greenhouse.tsv, lever.tsv) from scratch from the
# Wayback Machine's full history of each job-board domain, Hacker News and public job lists, checking
# every name against the platform. The result goes to the "company-rebuild" branch for review.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to rebuild (comma-separated: ashby, greenhouse, lever)"
        default: "ashby,greenhouse,lever"
        required: true

permissions:
  contents: write

concurrency:
  group: rebuild-companies
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The full Wayback scan of a big platform (Greenhouse) can take longer than one run allows, so its
      # progress is kept between runs. Running this workflow again continues where the last run stopped.
      - name: Restore Wayback scan progress from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: scraper/wayback_cache
          key: wayback-${{ github.run_id }}
          restore-keys: wayback-

      - name: Rebuild the company list from scratch
        timeout-minutes: 340
        run: python3 -u scraper/update_companies.py --rebuild --platforms "${{ inputs.platforms }}" --workers 10 --wayback-minutes 200 --wayback-total-minutes 285

      - name: Keep Wayback scan progress for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/wayback_cache
          key: wayback-${{ github.run_id }}

      - name: Save it to the company-rebuild branch for review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b company-rebuild
          git add -A scraper
          git diff --cached --quiet && { echo "No list changed this run."; exit 0; }
          git commit -m "Rebuild company list from the Wayback Machine and other public sources"
          git push -f origin company-rebuild
